<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
            width: 220px;
            padding: 4px;
            margin: 0;
            background-color: #ebebeb;
            color: #202223;
        }

        #errorMessage {
            display: none;
            padding: 12px;
            border-radius: 6px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.25);
            background-color: #fff;
            color: #202223;
            font-size: 12px;
            font-weight: 500;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 12px;
            border-radius: 6px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .toggle-label {
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .polaris-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .polaris-toggle {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 18px;
        }

        .polaris-toggle .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #8a8a8a;
            transition: .2s ease-in-out;
            border-radius: 6px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .polaris-toggle .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s ease-in-out;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .polaris-toggle input:checked + .slider {
            background-color: #303030;
            box-shadow: none;
        }

        .polaris-toggle input:checked + .slider:before {
            transform: translateX(100%);
        }

        .preload .slider, 
        .preload .slider:before {
            transition: none !important;
        }

        .token-row {
            background-color: #fff;
            padding: 12px;
            border-radius: 6px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.25);
            margin-top: 4px;
        }

        .token-row input {
            font-family: inherit;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 6px;
            border: 1px solid #8a8a8a;
            border-radius: 4px;
        }
    </style>
</head>
<body class="preload">

<div id="mainContent" style="display: none;">
    <div class="toggle-row">
        <label for="hidePublishToggle" class="toggle-label">Hide Publish Buttons</label>
        <label class="polaris-toggle">
            <input type="checkbox" id="hidePublishToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="token-row">
        <label for="resyncSecret" class="toggle-label">Resync Secret</label>
        <input type="password" id="resyncSecret" placeholder="Shared secret">
    </div>
</div>

    <div id="errorMessage" style="display: none;">
        <div class="warning-message">
            Please navigate to Shopify admin themes.
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
